<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Daily Agendas | Mr. McAteer</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: #ffffff; color: #212121;
  font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 15px; line-height: 1.65;
  padding: 18px 16px 48px;
}
.wrap { max-width: 720px; margin: 0 auto; }
.masthead { border-bottom: 1px solid #dadce0; padding-bottom: 14px;
  margin-bottom: 6px; }
.masthead h1 { font-size: 30px; font-weight: 300; letter-spacing: .5px;
  color: #74664d; margin: 0 0 4px; }
.masthead .meta { font-size: 13px; color: #5f6368; margin: 0 0 8px;
  text-transform: uppercase; letter-spacing: .6px; }
.masthead .note { font-size: 13px; color: #5f6368; margin: 0; }
.masthead .note a { color: #1155cc; }
.agenda-day { padding: 22px 0 4px; }
.agenda-day .day { font-size: 26px; font-weight: 300; letter-spacing: .5px;
  color: #74664d; margin: 0 0 2px; }
.agenda-day .title { font-size: 20px; font-weight: 400; color: #212121;
  margin: 0 0 4px; }
.agenda-day .periods { font-size: 12px; color: #5f6368; margin: 0 0 14px;
  letter-spacing: .5px; }
.body h1, .body h2, .body h3, .body h4 {
  font-size: 17px; font-weight: 500; color: #74664d;
  text-transform: uppercase; letter-spacing: .5px;
  margin: 20px 0 6px; }
.body p { margin: 0 0 10px; }
.body ul, .body ol { margin: 0 0 12px; padding-left: 24px; }
.body li { margin: 0 0 6px; }
.body a { color: #1155cc; }
.body strong { font-weight: 600; }
.body code { font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 13px; background: #f1f3f4; padding: 1px 4px; border-radius: 3px; }
.body table { border-collapse: collapse; margin: 0 0 12px; width: 100%; }
.body th, .body td { border: 1px solid #dadce0; padding: 6px 8px;
  text-align: left; font-size: 14px; }
hr { border: none; border-top: 1px solid #dadce0; margin: 26px 0; }
.foot { margin-top: 32px; padding-top: 12px; border-top: 1px solid #dadce0;
  font-size: 12px; color: #5f6368; }
@media (max-width: 480px) {
  body { padding: 14px 12px 36px; font-size: 15px; }
  .masthead h1 { font-size: 25px; }
  .agenda-day .day { font-size: 22px; }
}

.card { display: block; font-size: 20px; color: #1155cc;
  text-decoration: none; }
.card:hover { text-decoration: underline; }
.sub { display: block; font-size: 13px; color: #5f6368;
  text-transform: uppercase; letter-spacing: .6px; margin-bottom: 18px; }
</style>
</head>
<body>
<div class="wrap">
<div class="masthead"><h1>Daily Agendas</h1>
<p class="meta">Mr. McAteer &middot; Crescent Valley High School</p>
<p class="note">What we did in class, every teaching day.</p></div>
<p><a class="card" href="se/">Small Engines Daily Agenda</a><span class="sub">Period 3</span></p><p><a class="card" href="metals/">Metals Daily Agenda</a><span class="sub">Periods 5 and 7</span></p>
</div>
</body>
</html>
